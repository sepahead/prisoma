[package]
name = "pid-sim"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deterministic object-simulation harness and Flow_gt extraction for Prisoma"
license.workspace = true
repository.workspace = true
# Internal workspace crate (path-depends into the pid-rs submodule); never published to
# crates.io. Lets cargo-deny's `allow-wildcard-paths` exempt the versionless path deps.
publish = false

[lints]
workspace = true

[lib]
name = "pid_sim"
path = "src/lib.rs"

[[bin]]
name = "pid-sim-legacy-sensitivity"
path = "src/bin/power_gate.rs"
required-features = ["legacy-sensitivity"]

[[bin]]
name = "pid-sim-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "pid-sim-bridge-demo"
path = "src/bin/bridge_demo.rs"

[[bin]]
name = "pid-sim-bridge-stdio"
path = "src/bin/bridge_stdio.rs"

[[bin]]
name = "pid-sim-bridge-tcp"
path = "src/bin/bridge_tcp.rs"

[[bin]]
name = "pid-sim-bridge-ws"
path = "src/bin/bridge_ws.rs"
required-features = ["websocket"]

[[bin]]
name = "pid-sim-verify"
path = "src/bin/verify.rs"

[[bin]]
name = "pid-world-model-reference"
path = "src/bin/world_model_reference.rs"

[[bin]]
name = "pid-toy-harness"
path = "src/bin/toy_harness.rs"
required-features = ["analysis"]

[[bin]]
name = "pid-offline-harness"
path = "src/bin/offline_harness.rs"
required-features = ["analysis"]

[[bin]]
name = "pid-h1-preflight"
path = "src/bin/h1_preflight.rs"
required-features = ["protocol-references"]

[[bin]]
name = "pid-h1-protocol-a"
path = "src/bin/h1_protocol_a.rs"
required-features = ["protocol-references"]

[[bin]]
name = "pid-h2-reference"
path = "src/bin/h2_reference.rs"
required-features = ["protocol-references"]

[[bin]]
name = "pid-rapier-harness"
path = "src/bin/rapier_harness.rs"
required-features = ["rapier"]

[features]
default = []
analysis = ["dep:pid-core", "dep:same-file"]
legacy-sensitivity = []
protocol-references = []
rapier = ["dep:rapier3d-f64", "dep:same-file"]
rerun-export = ["dep:pid-rerun", "dep:tempfile"]
websocket = ["dep:sha1"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
# Operating-system CSPRNG for the Engram host bridge pairing secret. The bridge
# fails before it listens when this source is unavailable.
getrandom = "0.3"
# RustCrypto HMAC implementation for the Engram startup-secret proof. Keep the
# protocol framing here; do not maintain a local cryptographic primitive.
hmac = "0.13"
# The current pid-core review surface ships an empty default feature set: the continuous
# shared-exclusions estimators and the resampling/PLS pipelines the harnesses depend on are
# default-off research surfaces. Enabling a feature is a software switch, not a validity claim
# (`grandplan.md` §7.1).
pid-core = { path = "../../pid-rs/crates/pid-core", optional = true, features = [
    "experimental-continuous",
    "experimental-pipelines",
] }
pid-bridge = { path = "../pid-bridge" }
# Keep the Rerun/Arrow graph out of simulation, protocol, and offline-analysis
# builds that do not publish RRD files.
pid-rerun = { path = "../pid-rerun", optional = true }
pid-runlog = { path = "../../pid-rs/crates/pid-runlog" }
serde = { version = "1.0", features = ["derive"] }
# Preserve every finite IEEE-754 value across the JSON sidecar write/read boundary. The default
# fast parser can differ by one ULP, which invalidates exact derived-value and provenance checks.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
same-file = { version = "1.0", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = "0.11"
tempfile = { version = "3.20", optional = true }
zeroize = "1.9"
rapier3d-f64 = { version = "0.34", optional = true }

[target.'cfg(unix)'.dependencies]
# No-follow and nonblocking flags for descriptor-bound local input snapshots.
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"

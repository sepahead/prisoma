<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img"
     font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" aria-labelledby="ohTitle ohDesc">
  <title id="ohTitle">Offline (V,L,D,A) harness — pid-offline-harness</title>
  <desc id="ohDesc">Dataflow diagram of prisoma's offline (V,L,D,A) harness. An input dataset JSON with per-sample v/l/d/a vectors, labels, metadata.split, and episode_id flows through deterministic per-variable standardization and descriptive geometry diagnostics, then into parallel PID screens and non-PID baselines. Results merge into a summary JSON plus canonical run log, which is validated by pid-runlog-replay and converted to a read-only Rerun .rrd file. A side panel lists the fail-closed flags.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1278" height="818" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="470" y="48" text-anchor="middle" fill="#e5e7eb" font-size="24" font-weight="600">Offline (V,L,D,A) harness — pid-offline-harness</text>

  <!-- 1. Input dataset -->
  <rect x="140" y="78" width="660" height="70" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="470" y="107" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="600">Input dataset JSON</text>
  <text x="470" y="132" text-anchor="middle" fill="#e5e7eb" font-size="14">per-sample v/l/d/a vectors, labels, metadata.split, episode_id</text>
  <!-- side note -->
  <text x="812" y="100" fill="#94a3b8" font-size="14" font-style="italic">D = hidden-state</text>
  <text x="812" y="118" fill="#94a3b8" font-size="14" font-style="italic">axis, not depth</text>

  <line x1="470" y1="148" x2="470" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Standardization -->
  <rect x="140" y="180" width="660" height="62" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="470" y="206" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">Deterministic per-variable standardization</text>
  <text x="470" y="228" text-anchor="middle" fill="#e5e7eb" font-size="14">full-data descriptive and optional train-only split receipts</text>

  <line x1="470" y1="242" x2="470" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Geometry diagnostics (amber) -->
  <rect x="240" y="274" width="460" height="48" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="470" y="303" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">Descriptive geometry diagnostics</text>

  <!-- split arrows -->
  <path d="M 470 322 L 470 340 L 280 340 L 280 358" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 470 322 L 470 340 L 660 340 L 660 358" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4a. PID screens -->
  <rect x="100" y="362" width="360" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="280" y="392" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">PID screens</text>
  <text x="280" y="416" text-anchor="middle" fill="#e5e7eb" font-size="14">(V,L;A) · (V,D;A) · (L,D;A)</text>
  <text x="280" y="440" text-anchor="middle" fill="#e5e7eb" font-size="14">--pid-mode none | continuous |</text>
  <text x="280" y="459" text-anchor="middle" fill="#e5e7eb" font-size="14">categorical-sx | categorical-sx-pls</text>

  <!-- 4b. Non-PID baselines -->
  <rect x="480" y="362" width="360" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="660" y="392" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">Non-PID baselines</text>
  <text x="660" y="416" text-anchor="middle" fill="#e5e7eb" font-size="14">majority · 1-NN · nearest-centroid ·</text>
  <text x="660" y="440" text-anchor="middle" fill="#e5e7eb" font-size="14">held-out logistic regression</text>

  <!-- merge arrows -->
  <path d="M 280 472 L 280 492 L 470 492 L 470 508" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 660 472 L 660 492 L 470 492" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- 5. Summary + run log (green) -->
  <rect x="200" y="512" width="540" height="52" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="470" y="544" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">Summary JSON + canonical run log</text>

  <line x1="470" y1="564" x2="470" y2="592" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Replay validate -->
  <rect x="240" y="596" width="460" height="48" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="470" y="625" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">pid-runlog-replay --validate</text>

  <line x1="470" y1="644" x2="470" y2="672" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. Rerun export -->
  <rect x="240" y="676" width="460" height="48" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="470" y="705" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">runlog-to-rerun → .rrd (read-only viewer input)</text>

  <!-- Side panel: fail-closed flags (amber) -->
  <rect x="960" y="78" width="280" height="266" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="1100" y="108" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="600">Fail-closed flags</text>
  <text x="980" y="140" fill="#e5e7eb" font-size="14">--require-success-labels</text>
  <text x="980" y="168" fill="#e5e7eb" font-size="14">--require-heldout-split</text>
  <text x="980" y="196" fill="#e5e7eb" font-size="14">--require-heldout-class-coverage</text>
  <text x="980" y="224" fill="#e5e7eb" font-size="14">--require-heldout-episode-disjoint</text>
  <text x="980" y="252" fill="#e5e7eb" font-size="14">--require-axis-provenance-honest</text>
  <text x="980" y="288" fill="#94a3b8" font-size="14" font-style="italic">Geometry is descriptive only.</text>
  <text x="980" y="312" fill="#94a3b8" font-size="14" font-style="italic">A failed required gate exits</text>
  <text x="980" y="330" fill="#94a3b8" font-size="14" font-style="italic">nonzero with a valid failed run log.</text>

  <!-- Footer -->
  <line x1="60" y1="748" x2="1220" y2="748" stroke="#334155" stroke-width="1"/>
  <text x="640" y="778" text-anchor="middle" fill="#94a3b8" font-size="14">
    <tspan x="640" dy="0">--pid-mode none is the zero-MI/PID dependency firebreak.</tspan>
    <tspan x="640" dy="20">MGW categorical and Ehrlich continuous results are distinct diagnostics.</tspan>
  </text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img"
     font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" aria-labelledby="msTitle msDesc">
  <title id="msTitle">Milestones M0–M7</title>
  <desc id="msDesc">Prisoma v13.0 research milestone roadmap from grandplan.md section 12. Implemented infrastructure feeds the closed M0 scientific-contract gate. M1 has a runnable native exact-fork reference but remains open. M2 through M7 cover M4 learned-model qualification, the W1 pilot, W3 matched panels, locked W1, locked W2, and the conditional diagnostic and transport branch. They are unimplemented or blocked. Engineering state, not a research result.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1278" height="698" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#e5e7eb">Milestones M0–M7</text>

  <!-- ================= Row 1 (left to right) ================= -->

  <!-- Infrastructure groundwork : implemented (green) -->
  <g>
    <rect x="41" y="100" width="280" height="160" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="181" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">Infrastructure groundwork</text>
    <text x="181" y="152" text-anchor="middle" font-size="14" fill="#e5e7eb">(§8 event model + control plane)</text>
    <text x="181" y="176" text-anchor="middle" font-size="14" fill="#e5e7eb">run logs + replay, Agent Bridge,</text>
    <text x="181" y="196" text-anchor="middle" font-size="14" fill="#e5e7eb">pid-sim/Rapier, Rerun adapter</text>
    <text x="181" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">implemented</text>
  </g>

  <!-- M0 : current closed gate (violet) -->
  <g>
    <rect x="347" y="100" width="280" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="487" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M0 freeze scientific +</text>
    <text x="487" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">identification contracts</text>
    <text x="487" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">CURRENT CLOSED GATE</text>
  </g>

  <!-- M1 : runnable reference, milestone open (amber) -->
  <g>
    <rect x="653" y="100" width="280" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="793" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M1 exact-fork</text>
    <text x="793" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">decision contract</text>
    <text x="793" y="182" text-anchor="middle" font-size="14" fill="#e5e7eb">native reference runnable</text>
    <text x="793" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">milestone open</text>
  </g>

  <!-- M2 : blocked / unimplemented (red dashed) -->
  <g>
    <rect x="959" y="100" width="280" height="160" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="1099" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M2 M4 learned-world-model</text>
    <text x="1099" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">qualification</text>
    <text x="1099" y="188" text-anchor="middle" font-size="14" fill="#e5e7eb">LeWM MPS port, parity,</text>
    <text x="1099" y="208" text-anchor="middle" font-size="14" fill="#e5e7eb">CEM replay, resource receipts</text>
    <text x="1099" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">unimplemented</text>
  </g>

  <!-- Row 1 arrows -->
  <line x1="321" y1="180" x2="343" y2="180" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="627" y1="180" x2="649" y2="180" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="933" y1="180" x2="955" y2="180" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Snake connector: M2 down to M3 -->
  <path d="M 1099 260 C 1099 300, 1127 296, 1127 336" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= Row 2 (right to left) ================= -->

  <!-- M3 : blocked / specified only (red dashed) -->
  <g>
    <rect x="1017" y="340" width="220" height="150" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="1127" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M3 W1 forecast +</text>
    <text x="1127" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">ranking pilot</text>
    <text x="1127" y="420" text-anchor="middle" font-size="14" fill="#e5e7eb">blocked on M0 and M2</text>
    <text x="1127" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">blocked / specified only</text>
  </g>

  <!-- M4 : blocked / specified only (red dashed) -->
  <g>
    <rect x="773" y="340" width="220" height="150" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="883" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M4 W3 renderer + policy</text>
    <text x="883" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">matched panels</text>
    <text x="883" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">blocked / specified only</text>
  </g>

  <!-- M5 : blocked / specified only (red dashed) -->
  <g>
    <rect x="529" y="340" width="220" height="150" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="639" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M5 locked W1</text>
    <text x="639" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">blocked / specified only</text>
  </g>

  <!-- M6 : blocked / specified only (red dashed) -->
  <g>
    <rect x="285" y="340" width="220" height="150" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="395" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M6 locked W2</text>
    <text x="395" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">blocked / specified only</text>
  </g>

  <!-- M7 : blocked / specified only (red dashed) -->
  <g>
    <rect x="41" y="340" width="220" height="150" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="151" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">M7 conditional diagnostics</text>
    <text x="151" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#e5e7eb">+ transport</text>
    <text x="151" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">blocked / specified only</text>
  </g>

  <!-- Row 2 arrows (right to left) -->
  <line x1="1017" y1="415" x2="997" y2="415" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="773" y1="415" x2="753" y2="415" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="529" y1="415" x2="509" y2="415" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="415" x2="265" y2="415" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= Legend ================= -->
  <g>
    <rect x="41" y="548" width="1198" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <rect x="80" y="568" width="20" height="20" rx="4" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="110" y="583" font-size="14" fill="#e5e7eb">implemented</text>

    <rect x="280" y="568" width="20" height="20" rx="4" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="310" y="583" font-size="14" fill="#e5e7eb">reference; milestone open</text>

    <rect x="590" y="568" width="20" height="20" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="620" y="583" font-size="14" fill="#e5e7eb">current closed gate</text>

    <rect x="870" y="568" width="20" height="20" rx="4" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="900" y="583" font-size="14" fill="#e5e7eb">unimplemented / blocked</text>
  </g>

  <!-- Footer -->
  <text x="640" y="656" text-anchor="middle" font-size="15" font-style="italic" fill="#94a3b8">Engineering state, not a research result.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="1200" height="1120" role="img" aria-labelledby="title description">
<title id="title">Prisoma: experiment ordering and component ownership</title><desc id="description">Implemented affine reference: freeze one complete state and at least two supported actions; commit forecasts and scores; execute only the selected action through Agent Bridge; commit the receipt; obtain independent restored branch labels; compare and verify. Separate LeWM one-input inference and CREBAIN pending integration are not joined into a completed learned-model study. PID has four gates. Rerun is a derived consumer.</desc>
<defs><linearGradient id="header" x2="1" y2="1"><stop stop-color="#24203d"/><stop offset="1" stop-color="#0d101b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c2a8ff" stroke-width="2"/></marker></defs>
<rect width="1200" height="1120" rx="24" fill="#0d101b"/>
<path d="M24 0H1176Q1200 0 1200 24V145H0V24Q0 0 24 0" fill="url(#header)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#f1f0fa">
<text x="48" y="49" font-size="16" font-weight="650" fill="#c2a8ff">PRISOMA  /  EXPERIMENT SEMANTICS</text>
<text x="48" y="92" font-size="34" font-weight="650" fill="#f1f0fa">Forecast first. Compare with later outcomes.</text>
<text x="48" y="127" font-size="18" font-weight="400" fill="#c2c5d5">Implemented ordering reference · deterministic affine model · no scientific study result</text>
<rect x="48" y="176" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="76" cy="207" r="15" fill="#372c51"/>
<text x="70" y="213" font-size="18" font-weight="700" fill="#c2a8ff">1</text>
<text x="101" y="215" font-size="22" font-weight="650" fill="#f1f0fa">Freeze the decision</text>
<text x="70" y="256" font-size="19" font-weight="400" fill="#c2c5d5">One complete saved state</text>
<text x="70" y="284" font-size="19" font-weight="400" fill="#c2c5d5">Same permitted observations</text>
<text x="70" y="312" font-size="19" font-weight="400" fill="#c2c5d5">Ordered pool · at least 2 actions</text>
<rect x="440" y="176" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="468" cy="207" r="15" fill="#372c51"/>
<text x="462" y="213" font-size="18" font-weight="700" fill="#c2a8ff">2</text>
<text x="493" y="215" font-size="22" font-weight="650" fill="#f1f0fa">Forecast and commit</text>
<text x="462" y="256" font-size="19" font-weight="400" fill="#c2c5d5">Query every candidate</text>
<text x="462" y="284" font-size="19" font-weight="400" fill="#c2c5d5">Bind each prediction and score</text>
<text x="462" y="312" font-size="19" font-weight="400" fill="#c2c5d5">Keep reference labels closed</text>
<rect x="832" y="176" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="860" cy="207" r="15" fill="#372c51"/>
<text x="854" y="213" font-size="18" font-weight="700" fill="#c2a8ff">3</text>
<text x="885" y="215" font-size="22" font-weight="650" fill="#f1f0fa">Execute the selection</text>
<text x="854" y="256" font-size="19" font-weight="400" fill="#c2c5d5">Frozen rule chooses one action</text>
<text x="854" y="284" font-size="19" font-weight="400" fill="#c2c5d5">Agent Bridge owns mutation</text>
<text x="854" y="312" font-size="19" font-weight="400" fill="#c2c5d5">Commit the execution receipt</text>
<rect x="832" y="434" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="860" cy="465" r="15" fill="#372c51"/>
<text x="854" y="471" font-size="18" font-weight="700" fill="#c2a8ff">4</text>
<text x="885" y="473" font-size="22" font-weight="650" fill="#f1f0fa">Label restored branches</text>
<text x="854" y="514" font-size="19" font-weight="400" fill="#c2c5d5">Restore the same saved state</text>
<text x="854" y="542" font-size="19" font-weight="400" fill="#c2c5d5">One branch for each candidate</text>
<text x="854" y="570" font-size="19" font-weight="400" fill="#c2c5d5">Obtain later reference outcomes</text>
<rect x="440" y="434" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="468" cy="465" r="15" fill="#372c51"/>
<text x="462" y="471" font-size="18" font-weight="700" fill="#c2a8ff">5</text>
<text x="493" y="473" font-size="22" font-weight="650" fill="#f1f0fa">Compare fairly</text>
<text x="462" y="514" font-size="19" font-weight="400" fill="#c2c5d5">Forecast error ≠ decision value</text>
<text x="462" y="542" font-size="19" font-weight="400" fill="#c2c5d5">Match inputs and compute</text>
<text x="462" y="570" font-size="19" font-weight="400" fill="#c2c5d5">Retain failures and abstentions</text>
<rect x="48" y="434" width="320" height="170" rx="16" fill="#171b2b" stroke="#c2a8ff" stroke-width="1.5"/>
<circle cx="76" cy="465" r="15" fill="#372c51"/>
<text x="70" y="471" font-size="18" font-weight="700" fill="#c2a8ff">6</text>
<text x="101" y="473" font-size="22" font-weight="650" fill="#f1f0fa">Verify the evidence</text>
<text x="70" y="514" font-size="19" font-weight="400" fill="#c2c5d5">Rejoin forecasts and execution</text>
<text x="70" y="542" font-size="19" font-weight="400" fill="#c2c5d5">Check branch identity and replay</text>
<text x="70" y="570" font-size="19" font-weight="400" fill="#c2c5d5">Keep derived views read-only</text>
<path d="M368 259H433" fill="none" stroke="#c2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 259H825" fill="none" stroke="#c2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M992 346V426" fill="none" stroke="#c2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text x="704" y="389" font-size="18" font-weight="400" fill="#c2a8ff">Receipt precedes labels</text>
<path d="M832 517H767" fill="none" stroke="#c2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440 517H375" fill="none" stroke="#c2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="655" font-size="25" font-weight="650" fill="#f1f0fa">Separate components, separate evidence</text>
<rect x="48" y="680" width="540" height="166" rx="16" fill="#171b2b" stroke="#81dfcb" stroke-width="1.5"/>
<text x="72" y="714" font-size="23" font-weight="650" fill="#81dfcb">LeWM · real local model execution</text>
<text x="72" y="752" font-size="20" font-weight="400" fill="#c2c5d5">One frozen PushT input · CPU and MPS</text>
<text x="72" y="781" font-size="20" font-weight="400" fill="#c2c5d5">30 × 300 CEM · two source constructions</text>
<text x="72" y="810" font-size="20" font-weight="400" fill="#c2c5d5">Standardized inputs · no raw action or label</text>
<rect x="612" y="680" width="540" height="166" rx="16" fill="#171b2b" stroke="#f0cc88" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="636" y="714" font-size="23" font-weight="650" fill="#f0cc88">CREBAIN · selected environment</text>
<text x="636" y="752" font-size="20" font-weight="400" fill="#c2c5d5">Owns world, dynamics, and observations</text>
<text x="636" y="781" font-size="20" font-weight="400" fill="#c2c5d5">Prisoma embodied adapter under qualification</text>
<text x="636" y="810" font-size="20" font-weight="400" fill="#c2c5d5">Complete learned experiment remains open</text>
<rect x="48" y="873" width="350" height="123" rx="16" fill="#171b2b" stroke="#404660" stroke-width="1.5"/>
<text x="70" y="905" font-size="22" font-weight="650" fill="#c2a8ff">PID analysis</text>
<text x="70" y="939" font-size="18" font-weight="400" fill="#c2c5d5">Pinned pid-rs · four separate gates</text>
<text x="70" y="968" font-size="18" font-weight="400" fill="#c2c5d5">No candidate-target injection</text>
<rect x="425" y="873" width="350" height="123" rx="16" fill="#171b2b" stroke="#404660" stroke-width="1.5"/>
<text x="447" y="905" font-size="22" font-weight="650" fill="#81dfcb">Rerun</text>
<text x="447" y="939" font-size="18" font-weight="400" fill="#c2c5d5">Derived recording and inspection</text>
<text x="447" y="968" font-size="18" font-weight="400" fill="#c2c5d5">No experiment control authority</text>
<rect x="802" y="873" width="350" height="123" rx="16" fill="#171b2b" stroke="#404660" stroke-width="1.5"/>
<text x="824" y="905" font-size="22" font-weight="650" fill="#f1f0fa">Native NCP capture</text>
<text x="824" y="939" font-size="18" font-weight="400" fill="#c2c5d5">Optional causal-exchange journal</text>
<text x="824" y="968" font-size="18" font-weight="400" fill="#c2c5d5">Separate from schema-2 study logs</text>
<text x="48" y="1042" font-size="18" font-weight="400" fill="#c2c5d5">Arrows: reference execution order. Dashed boundary: integration still under qualification.</text>
<text x="48" y="1080" font-size="18" font-weight="400" fill="#c2c5d5">M2 and W1–W3 remain open. Model forecasts, reference outcomes, and physical measurements are distinct.</text>
</g></svg>

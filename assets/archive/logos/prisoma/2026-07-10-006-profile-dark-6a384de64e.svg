<svg xmlns="http://www.w3.org/2000/svg" viewBox="398 68 124 124" width="124" height="124" role="img" aria-label="PRISOMA historical profile mark"><title>PRISOMA historical profile mark</title><desc>Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</desc><defs><filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b" />

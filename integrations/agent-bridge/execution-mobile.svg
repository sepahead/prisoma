<svg xmlns="http://www.w3.org/2000/svg" width="480" height="950" viewBox="0 0 480 950" role="img" aria-labelledby="title desc"><title id="title">Recorded sensor execution, mobile view</title><desc id="desc">Record and synchronize the canonical request before dispatch. Capture CREBAIN advance, reads, and releases through NCP. Bind the execution receipt and synchronize the canonical response before returning observations. Finalization binds the complete capture by name, byte count, and SHA-256.</desc><rect width="480" height="950" rx="20" fill="#f5f8fb"/><g font-family="Arial, sans-serif" fill="#142c42"><text x="24" y="43" font-size="26" font-weight="bold">Recorded sensor execution</text><text x="24" y="75" font-size="18" fill="#475e73">One command. Two joined records.</text><rect x="24" y="110" width="432" height="148" rx="14" fill="#fff" stroke="#cbd9e4" stroke-width="1.5"/><circle cx="53" cy="141" r="16" fill="#177d81"/><text x="53" y="148" font-size="19" text-anchor="middle" fill="#fff">1</text><text x="80" y="148" font-size="20" font-weight="bold">Record the accepted request</text><g font-size="19" fill="#475e73"><text x="44" y="185">Synchronize before the callback</text><text x="44" y="211">can execute.</text></g><text x="44" y="240" font-size="18" fill="#5369a6">run.jsonl · Canonical request</text><path d="M240 260v20m-6-7 6 7 6-7" fill="none" stroke="#177d81" stroke-width="2.5"/><rect x="24" y="285" width="432" height="148" rx="14" fill="#fff" stroke="#cbd9e4" stroke-width="1.5"/><circle cx="53" cy="316" r="16" fill="#177d81"/><text x="53" y="323" font-size="19" text-anchor="middle" fill="#fff">2</text><text x="80" y="323" font-size="20" font-weight="bold">Execute and capture</text><g font-size="19" fill="#475e73"><text x="44" y="360">Advance → read due payloads</text><text x="44" y="386">→ release source buffers.</text></g><text x="44" y="415" font-size="18" fill="#5369a6">capture.ncp · Original NCP frames</text><path d="M240 435v20m-6-7 6 7 6-7" fill="none" stroke="#177d81" stroke-width="2.5"/><rect x="24" y="460" width="432" height="148" rx="14" fill="#fff" stroke="#cbd9e4" stroke-width="1.5"/><circle cx="53" cy="491" r="16" fill="#177d81"/><text x="53" y="498" font-size="19" text-anchor="middle" fill="#fff">3</text><text x="80" y="498" font-size="20" font-weight="bold">Bind the execution receipt</text><g font-size="19" fill="#475e73"><text x="44" y="535">Join command, capture span,</text><text x="44" y="561">sensor IDs, and payload digests.</text></g><text x="44" y="590" font-size="18" fill="#5369a6">run.jsonl · Execution receipt</text><path d="M240 610v20m-6-7 6 7 6-7" fill="none" stroke="#177d81" stroke-width="2.5"/><rect x="24" y="635" width="432" height="148" rx="14" fill="#fff" stroke="#cbd9e4" stroke-width="1.5"/><circle cx="53" cy="666" r="16" fill="#177d81"/><text x="53" y="673" font-size="19" text-anchor="middle" fill="#fff">4</text><text x="80" y="673" font-size="20" font-weight="bold">Commit the response</text><g font-size="19" fill="#475e73"><text x="44" y="710">Synchronize before returning</text><text x="44" y="736">the immutable observation.</text></g><text x="44" y="765" font-size="18" fill="#5369a6">run.jsonl · Canonical response</text><rect x="24" y="817" width="432" height="109" rx="14" fill="#e5f2f0"/><text x="42" y="846" font-size="20" font-weight="bold">Finalization joins the complete capture.</text><g font-size="18" fill="#475e73"><text x="42" y="874">Filename + byte count + SHA-256.</text><text x="42" y="903">Content identity does not prove authenticity.</text></g></g></svg>
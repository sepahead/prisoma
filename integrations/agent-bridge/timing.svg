<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">Two cameras and one microphone retain separate schedules</title><desc id="desc">At body ticks one through six, camera A is due at two, four, and six. Camera B is due at three and six. The microphone supplies 133, 133, 134, 133, 133, and 134 samples. Empty camera circles mean not due, not zero activity. Each source keeps its declared identity.</desc>
<rect width="800" height="340" rx="18" fill="#f5f8fb"/>
<g font-family="Arial, sans-serif" fill="#142c42"><text x="28" y="39" font-size="25" font-weight="bold">Three sensor instances. Two modalities.</text><text x="28" y="68" font-size="18" fill="#475e73">Six body ticks at 120 Hz = 0.05 simulated second</text>
<g font-size="19"><text x="30" y="146">RGB camera A</text><text x="30" y="199">RGB camera B</text><text x="30" y="253">Microphone</text></g>
<g font-size="16" fill="#475e73"><text x="30" y="169">Period: 2 ticks</text><text x="30" y="222">Period: 3 ticks</text><text x="30" y="276">Samples per window</text></g><text x="300" y="111" font-size="18" text-anchor="middle">1</text><path d="M300 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="300" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#f5f8fb"/><circle cx="300" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#f5f8fb"/><rect x="273" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="300" y="263" font-size="20" text-anchor="middle">133</text><text x="378" y="111" font-size="18" text-anchor="middle">2</text><path d="M378 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="378" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#177d81"/><path d="M372 148l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="378" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#f5f8fb"/><rect x="351" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="378" y="263" font-size="20" text-anchor="middle">133</text><text x="456" y="111" font-size="18" text-anchor="middle">3</text><path d="M456 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="456" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#f5f8fb"/><circle cx="456" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#5369a6"/><path d="M450 202l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><rect x="429" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="456" y="263" font-size="20" text-anchor="middle">134</text><text x="534" y="111" font-size="18" text-anchor="middle">4</text><path d="M534 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="534" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#177d81"/><path d="M528 148l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="534" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#f5f8fb"/><rect x="507" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="534" y="263" font-size="20" text-anchor="middle">133</text><text x="612" y="111" font-size="18" text-anchor="middle">5</text><path d="M612 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="612" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#f5f8fb"/><circle cx="612" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#f5f8fb"/><rect x="585" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="612" y="263" font-size="20" text-anchor="middle">133</text><text x="690" y="111" font-size="18" text-anchor="middle">6</text><path d="M690 122V276" stroke="#d7e1e8" stroke-width="1"/><circle cx="690" cy="148" r="13" stroke="#177d81" stroke-width="2" fill="#177d81"/><path d="M684 148l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="690" cy="202" r="13" stroke="#5369a6" stroke-width="2" fill="#5369a6"/><path d="M684 202l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><rect x="663" y="239" width="54" height="35" rx="8" fill="#e6eef4"/><text x="690" y="263" font-size="20" text-anchor="middle">134</text><text x="28" y="316" font-size="18" fill="#475e73">Filled circle = due image. Empty circle = not due. Total = 800 acoustic samples.</text></g></svg>
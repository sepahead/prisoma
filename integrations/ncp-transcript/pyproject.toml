[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prisoma-ncp-transcript"
version = "0.1.0"
description = "Bounded durable capture of modular NCP exchanges on host-owned streams"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = ["ncp-local @ git+https://github.com/sepahead/NCP.git@233de821a5b67a34aa7721f900c09ab73a61ba88#subdirectory=local/python"]

[project.urls]
Repository = "https://github.com/sepahead/prisoma"
Issues = "https://github.com/sepahead/prisoma/issues"

[tool.setuptools.packages.find]
where = ["src"]

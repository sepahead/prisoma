name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PID_RUNLOG_REPLAY: ${{ github.workspace }}/pid-rs/target/debug/pid-runlog-replay

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # pid-core / pid-runlog live in the `pid-rs` submodule (single source of truth:
          # https://github.com/sepahead/pid-rs). Fetch it so the path-deps resolve.
          submodules: recursive
      - name: Install Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default 1.93.0
          rustc --version | grep -F 'rustc 1.93.0 '
      - name: Build the run-log verifier once
        run: cargo build --locked --manifest-path pid-rs/crates/pid-runlog/Cargo.toml --bin pid-runlog-replay
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (ncp-observer)
        run: cargo fmt --manifest-path crates/ncp-observer/Cargo.toml --all -- --check
      - name: Check lean default surface
        run: |
          cargo check --locked -p pid-bridge -p pid-sim --all-targets --no-default-features
          cargo test --locked -p pid-sim --no-default-features lean_bridge_surface_excludes_rerun_export
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # `ncp-observer` is intentionally NOT a default workspace member (it git-depends
      # on the published NCP SDK + Zenoh, kept off prisoma's critical path), so the
      # `--workspace` clippy above never compiles it. Compile it explicitly against the
      # frozen NCP v0.8.0 tag. A different wire requires a separate consumer surface.
      - name: Clippy (ncp-observer, NCP consumer — excluded from the workspace)
        run: cargo clippy --locked --manifest-path crates/ncp-observer/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Rapier manipulation harness smoke
        run: |
          cargo run --locked -p pid-sim --features rapier --bin pid-rapier-harness -- \
            --runlog /tmp/prisoma_rapier_push.jsonl --summary-json /tmp/prisoma_rapier_push.json --push-impulse 0.18
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_rapier_push.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_rapier_push.jsonl | grep -F 'errors=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_rapier_push.jsonl | grep -F 'flow_gt_records=301' >/dev/null
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
      - name: Rustdoc (ncp-observer)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --manifest-path crates/ncp-observer/Cargo.toml --no-deps
      - name: Tests + deterministic protocol-fault observatory (ncp-observer)
        run: |
          cargo test --locked --manifest-path crates/ncp-observer/Cargo.toml
          OUT="$RUNNER_TEMP/prisoma_ncp_fault_observatory"
          test ! -e "$OUT"
          cargo run --locked --manifest-path crates/ncp-observer/Cargo.toml --bin ncp-fault-observatory -- --out-dir "$OUT"
          cargo run --locked --manifest-path crates/ncp-observer/Cargo.toml --bin ncp-fault-observatory -- --verify "$OUT"
          # Report schema 1 retains this legacy spelling; it does not grant E3 semantics.
          grep -q '"evidence_level": "fixture_specific_e3_style_local_evidence_only"' "$OUT"/observatory-report-*.json
          grep -q '"all_expectations_matched": true' "$OUT"/observatory.publication.json
          grep -q '"establishes_e4": false' "$OUT"/observatory-report-*.json
          grep -q '"establishes_security_validation": false' "$OUT"/observatory-report-*.json
          "$PID_RUNLOG_REPLAY" --validate "$OUT/observatory-runlog.jsonl"
      - name: PID-request firebreak (grandplan.md §8.9.3)
        run: |
          # The `--workspace` build/clippy/tests above never compiled `ncp-observer`
          # (workspace-excluded), proving the NCP-disabled core path; the dedicated
          # `Clippy (ncp-observer …)` step is a separate opt-in consumer check. Here we
          # assert static factual-outcome label baselines (majority + the SAFE-class held-out
          # logistic regression) emit without an MI or PID estimator request. The analysis
          # binary still links shared pid-core geometry and logistic code. This is dependency
          # groundwork, not H1 response scoring or prospective H2 landmark prediction.
          cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input crates/pid-sim/fixtures/offline_vlda_fixture.json --summary-json /tmp/prisoma_firebreak_summary.json --runlog /tmp/prisoma_firebreak_runlog.jsonl --pid-mode none
          jq -e '
            (.metrics.majority_success_accuracy | type == "number") and
            (.metrics.heldout_logreg_vlda_success_accuracy | type == "number") and
            .config.metric_pipeline.pid_mode == "Disabled" and
            .config.metric_pipeline.mi_functional == "not_requested" and
            .config.metric_pipeline.pid_functional == "not_requested" and
            .config.metric_pipeline.mi_estimator == "not_applicable" and
            .config.metric_pipeline.pid_estimator == "not_applicable" and
            .metrics.estimate_denominators.requested == 0 and
            .metrics.estimate_denominators.estimated == 0 and
            .metrics.estimate_denominators.abstained == 0 and
            .metrics.pid_pairs == {} and
            .metrics.mi_v_action.status == "not_requested" and
            .metrics.mi_l_action.status == "not_requested" and
            .metrics.mi_d_action.status == "not_requested"
          ' /tmp/prisoma_firebreak_summary.json >/dev/null
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_firebreak_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_firebreak_runlog.jsonl | grep -F 'pid_metrics=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_firebreak_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
      - name: Run-log smoke
        run: |
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-preflight -- --input crates/pid-sim/fixtures/h1_preflight_valid.json --summary-json /tmp/prisoma_h1_preflight_summary.json --runlog /tmp/prisoma_h1_preflight_runlog.jsonl
          grep -q '"passed": true' /tmp/prisoma_h1_preflight_summary.json
          grep -q '"establishes_h1_evidence": false' /tmp/prisoma_h1_preflight_summary.json
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h1_preflight_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_runlog.jsonl | grep -F 'pid_metrics=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          cp /tmp/prisoma_h1_preflight_runlog.jsonl /tmp/prisoma_h1_preflight_runlog.first.jsonl
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-preflight -- --input crates/pid-sim/fixtures/h1_preflight_valid.json --summary-json /tmp/prisoma_h1_preflight_summary.json --runlog /tmp/prisoma_h1_preflight_runlog.jsonl
          cmp -s /tmp/prisoma_h1_preflight_runlog.first.jsonl /tmp/prisoma_h1_preflight_runlog.jsonl
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-preflight -- --input crates/pid-sim/fixtures/h1_preflight_invalid.json --summary-json /tmp/prisoma_h1_preflight_invalid_summary.json --runlog /tmp/prisoma_h1_preflight_invalid_runlog.jsonl; then exit 1; fi
          grep -q '"artifact_hash_mismatch"' /tmp/prisoma_h1_preflight_invalid_summary.json
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h1_preflight_invalid_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_invalid_runlog.jsonl | grep -F 'errors=1' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_invalid_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-preflight -- --input crates/pid-sim/fixtures/h1_preflight_parse_invalid.json --summary-json /tmp/prisoma_h1_preflight_parse_invalid_summary.json --runlog /tmp/prisoma_h1_preflight_parse_invalid_runlog.jsonl; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h1_preflight_parse_invalid_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_parse_invalid_runlog.jsonl | grep -F 'errors=1' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_preflight_parse_invalid_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          # The checked Protocol-A fixture binds these exact repo-relative artifact URIs and bytes.
          mkdir -p outputs
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-preflight -- --input crates/pid-sim/fixtures/h1_preflight_valid.json --summary-json outputs/h1_preflight_summary.json --runlog outputs/h1_preflight_runlog.jsonl
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-protocol-a -- --input crates/pid-sim/fixtures/h1_protocol_a_valid.json --preflight-input crates/pid-sim/fixtures/h1_preflight_valid.json --preflight-summary outputs/h1_preflight_summary.json --preflight-runlog outputs/h1_preflight_runlog.jsonl --summary-json outputs/h1_protocol_a_summary.json --runlog outputs/h1_protocol_a_runlog.jsonl
          grep -q '"passed": true' outputs/h1_protocol_a_summary.json
          grep -q '"synthetic_fixture_only": true' outputs/h1_protocol_a_summary.json
          grep -q '"establishes_h1_evidence": false' outputs/h1_protocol_a_summary.json
          "$PID_RUNLOG_REPLAY" --validate outputs/h1_protocol_a_runlog.jsonl
          "$PID_RUNLOG_REPLAY" outputs/h1_protocol_a_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-protocol-a -- --input crates/pid-sim/fixtures/h1_protocol_a_valid.json --preflight-input crates/pid-sim/fixtures/h1_preflight_valid.json --preflight-summary /tmp/prisoma_h1_preflight_invalid_summary.json --preflight-runlog /tmp/prisoma_h1_preflight_invalid_runlog.jsonl --summary-json /tmp/prisoma_h1_protocol_a_invalid_preflight_summary.json --runlog /tmp/prisoma_h1_protocol_a_invalid_preflight_runlog.jsonl; then exit 1; fi
          grep -q '"preflight_summary_not_eligible"' /tmp/prisoma_h1_protocol_a_invalid_preflight_summary.json
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h1_protocol_a_invalid_preflight_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_protocol_a_invalid_preflight_runlog.jsonl | grep -F 'evaluation_metric_events=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_protocol_a_invalid_preflight_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h1-protocol-a -- --input crates/pid-sim/fixtures/h1_protocol_a_parse_invalid.json --preflight-input crates/pid-sim/fixtures/h1_preflight_valid.json --preflight-summary outputs/h1_preflight_summary.json --preflight-runlog outputs/h1_preflight_runlog.jsonl --summary-json /tmp/prisoma_h1_protocol_a_parse_invalid_summary.json --runlog /tmp/prisoma_h1_protocol_a_parse_invalid_runlog.jsonl; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h1_protocol_a_parse_invalid_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_protocol_a_parse_invalid_runlog.jsonl | grep -F 'evaluation_metric_events=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h1_protocol_a_parse_invalid_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          # Synthetic fixed-horizon H2 protocol arithmetic only: no prospective capture,
          # H2 evidence, control-plane events, or PID events.
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h2-reference -- --dataset crates/pid-sim/fixtures/h2_reference/dataset_complete.json --analysis-plan crates/pid-sim/fixtures/h2_reference/analysis_plan.json --event-ontology crates/pid-sim/fixtures/h2_reference/event_ontology.json --feature-contract crates/pid-sim/fixtures/h2_reference/feature_contract.json --split-manifest crates/pid-sim/fixtures/h2_reference/split_manifest.json --summary-json /tmp/prisoma_h2_reference_summary.json --runlog /tmp/prisoma_h2_reference_runlog.jsonl
          grep -q '"passed": true' /tmp/prisoma_h2_reference_summary.json
          grep -q '"establishes_h2_evidence": false' /tmp/prisoma_h2_reference_summary.json
          grep -q '"prospective_capture": false' /tmp/prisoma_h2_reference_summary.json
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h2_reference_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_reference_runlog.jsonl | grep -F 'actions=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_reference_runlog.jsonl | grep -F 'interventions=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_reference_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          cargo run --locked -p pid-sim --features protocol-references --bin pid-h2-reference -- --dataset crates/pid-sim/fixtures/h2_reference/dataset_censored.json --analysis-plan crates/pid-sim/fixtures/h2_reference/analysis_plan.json --event-ontology crates/pid-sim/fixtures/h2_reference/event_ontology.json --feature-contract crates/pid-sim/fixtures/h2_reference/feature_contract.json --split-manifest crates/pid-sim/fixtures/h2_reference/split_manifest.json --summary-json /tmp/prisoma_h2_censored_summary.json --runlog /tmp/prisoma_h2_censored_runlog.jsonl
          grep -q '"censored_outcomes": 1' /tmp/prisoma_h2_censored_summary.json
          grep -q '"ipcw_weight": null' /tmp/prisoma_h2_censored_summary.json
          grep -q '"reason": "alarm_followup_incomplete"' /tmp/prisoma_h2_censored_summary.json
          python -c 'import json; d=json.load(open("/tmp/prisoma_h2_censored_summary.json")); p=[x for f in d["report"]["fold_outcomes"] if f["status"]=="produced" for x in f["score"]["predictions"]]; w=lambda e: next(x["ipcw_weight"] for x in p if x["episode_id"]==e); ok=w("episode-4")==w("episode-5")==1.0 and abs(w("episode-6")-4/3)<1e-12 and abs(w("episode-7")-4/3)<1e-12; raise SystemExit(0 if ok else "unexpected reverse-KM IPCW weights")'
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h2_censored_runlog.jsonl
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h2-reference -- --dataset crates/pid-sim/fixtures/h2_reference/dataset_parse_invalid.json --analysis-plan crates/pid-sim/fixtures/h2_reference/analysis_plan.json --event-ontology crates/pid-sim/fixtures/h2_reference/event_ontology.json --feature-contract crates/pid-sim/fixtures/h2_reference/feature_contract.json --split-manifest crates/pid-sim/fixtures/h2_reference/split_manifest.json --summary-json /tmp/prisoma_h2_invalid_summary.json --runlog /tmp/prisoma_h2_invalid_runlog.jsonl; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h2_invalid_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_invalid_runlog.jsonl | grep -F 'evaluation_metric_events=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_invalid_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          perl -0pe 's/"censoring_stratum_frozen_at_ns": 0/"censoring_stratum_frozen_at_ns": 11/' crates/pid-sim/fixtures/h2_reference/dataset_complete.json > /tmp/prisoma_h2_semantic_invalid.json
          if cargo run --locked -p pid-sim --features protocol-references --bin pid-h2-reference -- --dataset /tmp/prisoma_h2_semantic_invalid.json --analysis-plan crates/pid-sim/fixtures/h2_reference/analysis_plan.json --event-ontology crates/pid-sim/fixtures/h2_reference/event_ontology.json --feature-contract crates/pid-sim/fixtures/h2_reference/feature_contract.json --split-manifest crates/pid-sim/fixtures/h2_reference/split_manifest.json --summary-json /tmp/prisoma_h2_semantic_invalid_summary.json --runlog /tmp/prisoma_h2_semantic_invalid_runlog.jsonl; then exit 1; fi
          grep -q '"feature_unavailable_at_landmark"' /tmp/prisoma_h2_semantic_invalid_summary.json
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_h2_semantic_invalid_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_semantic_invalid_runlog.jsonl | grep -F 'evaluation_metric_events=0' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_h2_semantic_invalid_runlog.jsonl | grep -F 'pid_metric_events=0' >/dev/null
          cargo run --locked --manifest-path pid-rs/crates/pid-core/Cargo.toml --features experimental-all --bin exp0 -- --seeds 1 --summary-json /tmp/prisoma_exp0_summary.json --runlog /tmp/prisoma_exp0_runlog.jsonl
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_exp0_runlog.jsonl
          cargo run --locked -p pid-sim --features analysis --bin pid-toy-harness -- --episodes 32 --summary-json /tmp/prisoma_toy_summary.json --runlog /tmp/prisoma_toy_runlog.jsonl
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_toy_runlog.jsonl
          # Exercise the positive continuous path only on the synthetic fixture that
          # declares every required complete-tuple joint-law contract. The mixed-support
          # fixture below remains the fail-closed abstention and held-out-gate surface.
          cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input crates/pid-sim/fixtures/offline_vlda_continuous_fixture.json --summary-json /tmp/prisoma_offline_vlda_summary.json --runlog /tmp/prisoma_offline_vlda_runlog.jsonl --pid-mode continuous
          jq -e '
            .config.metric_pipeline.pid_mode == "Continuous" and
            (.config.continuous_tuple_support | length) == 6 and
            ([.config.continuous_tuple_support[]] | all(. == "regular_full_dimensional_finite_information")) and
            ([.metrics.mi_v_action, .metrics.mi_l_action, .metrics.mi_d_action,
              .metrics.pid_pairs.VL, .metrics.pid_pairs.VD, .metrics.pid_pairs.LD]
             | all(.status == "produced" and
                   .information_units == "nats" and
                   .scientific_gates.population == "conditional" and
                   .scientific_gates.application == "blocked" and
                   .scientific_gates.interpretation_allowed == false and
                   .scientific_gates.reason_code == "application_support_envelope_not_validated")) and
            .metrics.estimate_denominators.requested == 6 and
            .metrics.estimate_denominators.estimated == 6 and
            .metrics.estimate_denominators.abstained == 0
          ' /tmp/prisoma_offline_vlda_summary.json >/dev/null
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_runlog.jsonl | awk '
            { for (i = 1; i <= NF; i++) seen[$i] = 1 }
            END {
              exit !(seen["embedding_contracts=1"] &&
                     seen["pid_metrics=42"] && seen["pid_metric_events=42"] &&
                     seen["geometry_metrics=25"] && seen["geometry_metric_events=25"] &&
                     seen["evaluation_metrics=152"] && seen["evaluation_metric_events=701"])
            }
          '
          # One positive run proves the three compatible held-out gates together.
          # Unit tests retain isolated failure coverage for each gate.
          cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input crates/pid-sim/fixtures/offline_vlda_fixture.json --summary-json /tmp/prisoma_offline_vlda_heldout_summary.json --runlog /tmp/prisoma_offline_vlda_heldout_runlog.jsonl --require-heldout-split --require-heldout-class-coverage --require-heldout-episode-disjoint
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_heldout_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_heldout_runlog.jsonl | grep -F 'errors=0' >/dev/null
          python - <<'PY'
          import json
          src = "crates/pid-sim/fixtures/offline_vlda_fixture.json"
          dst = "/tmp/prisoma_offline_vlda_unlabeled.json"
          with open(src) as f:
              data = json.load(f)
          for sample in data["samples"]:
              sample["labels"].pop("success", None)
          with open(dst, "w") as f:
              json.dump(data, f)
          PY
          if cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input /tmp/prisoma_offline_vlda_unlabeled.json --summary-json /tmp/prisoma_offline_vlda_unlabeled_summary.json --runlog /tmp/prisoma_offline_vlda_unlabeled_runlog.jsonl --require-success-labels; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_unlabeled_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_unlabeled_runlog.jsonl | grep -F 'errors=1' >/dev/null
          python - <<'PY'
          import json
          src = "crates/pid-sim/fixtures/offline_vlda_fixture.json"
          dst = "/tmp/prisoma_offline_vlda_unsplit.json"
          with open(src) as f:
              data = json.load(f)
          for sample in data["samples"]:
              sample.get("metadata", {}).pop("split", None)
          with open(dst, "w") as f:
              json.dump(data, f)
          PY
          if cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input /tmp/prisoma_offline_vlda_unsplit.json --summary-json /tmp/prisoma_offline_vlda_unsplit_summary.json --runlog /tmp/prisoma_offline_vlda_unsplit_runlog.jsonl --require-heldout-split; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_unsplit_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_unsplit_runlog.jsonl | grep -F 'errors=1' >/dev/null
          python - <<'PY'
          import json
          src = "crates/pid-sim/fixtures/offline_vlda_fixture.json"
          dst = "/tmp/prisoma_offline_vlda_uncovered_class.json"
          with open(src) as f:
              data = json.load(f)
          for sample in data["samples"]:
              if sample.get("metadata", {}).get("split") == "test":
                  sample["labels"]["success"] = True
          with open(dst, "w") as f:
              json.dump(data, f)
          PY
          if cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input /tmp/prisoma_offline_vlda_uncovered_class.json --summary-json /tmp/prisoma_offline_vlda_uncovered_class_summary.json --runlog /tmp/prisoma_offline_vlda_uncovered_class_runlog.jsonl --require-heldout-class-coverage; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_uncovered_class_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_uncovered_class_runlog.jsonl | grep -F 'errors=1' >/dev/null
          python - <<'PY'
          import json
          src = "crates/pid-sim/fixtures/offline_vlda_fixture.json"
          dst = "/tmp/prisoma_offline_vlda_leaky_episode.json"
          with open(src) as f:
              data = json.load(f)
          train_episode = data["samples"][0]["episode_id"]
          for sample in data["samples"]:
              if sample.get("metadata", {}).get("split") == "test":
                  sample["episode_id"] = train_episode
                  break
          with open(dst, "w") as f:
              json.dump(data, f)
          PY
          if cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input /tmp/prisoma_offline_vlda_leaky_episode.json --summary-json /tmp/prisoma_offline_vlda_leaky_episode_summary.json --runlog /tmp/prisoma_offline_vlda_leaky_episode_runlog.jsonl --require-heldout-episode-disjoint; then exit 1; fi
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_offline_vlda_leaky_episode_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_offline_vlda_leaky_episode_runlog.jsonl | grep -F 'errors=1' >/dev/null
          cargo run --locked -p pid-bridge --bin pid-bridge-contract -- --out /tmp/prisoma_bridge_runlog_contract.json
          cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-demo -- /tmp/prisoma_bridge_demo.jsonl
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_bridge_demo.jsonl
          "$PID_RUNLOG_REPLAY" --compare /tmp/prisoma_bridge_demo.jsonl /tmp/prisoma_bridge_demo.jsonl
          "$PID_RUNLOG_REPLAY" --summary-json /tmp/prisoma_bridge_demo.jsonl /tmp/prisoma_bridge_summary.json
          "$PID_RUNLOG_REPLAY" --manifest-json /tmp/prisoma_bridge_demo.jsonl /tmp/prisoma_bridge_manifest.json
          "$PID_RUNLOG_REPLAY" --write-sidecars /tmp/prisoma_bridge_demo.jsonl
          "$PID_RUNLOG_REPLAY" --verify-sidecars /tmp/prisoma_bridge_demo.jsonl
          cargo run --locked -p pid-sim --bin pid-sim-verify -- /tmp/prisoma_bridge_demo.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_demo.jsonl | grep -F 'flow_pred_records=10' >/dev/null
          cargo run --locked -p pid-rerun --bin runlog-to-rerun -- /tmp/prisoma_bridge_demo.jsonl --save /tmp/prisoma_bridge_demo.rrd
          EXPORT_OUT="$(mktemp)"
          printf '%s\n' '{"jsonrpc":"2.0","id":"export","method":"export.rerun","params":{"run_log_uri":"/tmp/prisoma_bridge_demo.jsonl","output_uri":"/tmp/prisoma_bridge_export.rrd"}}' | cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-stdio -- /tmp/prisoma_bridge_export_stdio.jsonl | tee "$EXPORT_OUT"
          grep -q '"id":"export"' "$EXPORT_OUT"
          grep -q '"sha256"' "$EXPORT_OUT"
          test -s /tmp/prisoma_bridge_export.rrd
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_bridge_export_stdio.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_export_stdio.jsonl | grep -F 'artifacts=1' >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":"status","method":"sim.status","params":{}}' '{"jsonrpc":"2.0","id":"intervention","method":"intervention.apply","params":{"intervention_type":"set_velocity","payload":{"object_id":"red_cube","velocity":[0.2,0.0,0.0]}}}' '{"jsonrpc":"2.0","id":"step","method":"sim.step","params":{"dt":0.1}}' '{"jsonrpc":"2.0","id":"stop","method":"log.stop","params":{}}' | cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-stdio -- /tmp/prisoma_bridge_stdio.jsonl
          cargo run --locked -p pid-sim --bin pid-sim-verify -- /tmp/prisoma_bridge_stdio.jsonl
          SAFE_OUT="$(mktemp)"
          printf '%s\n' '{"jsonrpc":"2.0","id":"status","method":"sim.status","params":{}}' '{"jsonrpc":"2.0","id":"replay","method":"log.replay","params":{"run_log_uri":"/tmp/prisoma_bridge_demo.jsonl"}}' '{"jsonrpc":"2.0","id":"safe-export","method":"export.rerun","params":{"run_log_uri":"/tmp/prisoma_bridge_demo.jsonl","output_uri":"/tmp/prisoma_bridge_safe_export.rrd"}}' '{"jsonrpc":"2.0","id":"step","method":"sim.step","params":{"dt":0.1}}' | cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-stdio -- --safe-mode /tmp/prisoma_bridge_stdio_safe.jsonl | tee "$SAFE_OUT"
          grep -q '"id":"replay"' "$SAFE_OUT"
          grep -q '"trace_hash"' "$SAFE_OUT"
          grep -q 'bridge safe mode blocked method export.rerun' "$SAFE_OUT"
          grep -q 'bridge safe mode blocked method sim.step' "$SAFE_OUT"
          test ! -e /tmp/prisoma_bridge_safe_export.rrd
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_bridge_stdio_safe.jsonl
          TCP_PID=""
          WS_PID=""
          cleanup_bridge_servers() {
            if [ -n "$TCP_PID" ]; then
              kill -- "-$TCP_PID" 2>/dev/null || true
              wait "$TCP_PID" 2>/dev/null || true
            fi
            if [ -n "$WS_PID" ]; then
              kill -- "-$WS_PID" 2>/dev/null || true
              wait "$WS_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_bridge_servers EXIT
          if cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-tcp -- --bind "0.0.0.0:0" /tmp/prisoma_bridge_tcp_nonloopback.jsonl; then exit 1; fi
          test ! -e /tmp/prisoma_bridge_tcp_nonloopback.jsonl
          setsid cargo run --locked -p pid-sim --features rerun-export --bin pid-sim-bridge-tcp -- --allow-mutations --bind "127.0.0.1:0" /tmp/prisoma_bridge_tcp.jsonl 2>/tmp/prisoma_bridge_tcp.server.log &
          TCP_PID="$!"
          python - <<'PY' /tmp/prisoma_bridge_tcp.server.log > /tmp/prisoma_bridge_tcp.out
          import pathlib, re, socket, sys, time
          deadline = time.time() + 30
          log_path = pathlib.Path(sys.argv[1])
          port = None
          while port is None:
              text = log_path.read_text() if log_path.exists() else ""
              match = re.search(r"(?:^|\n)listening 127\.0\.0\.1:(\d+)(?:\n|$)", text)
              if match:
                  port = int(match.group(1))
                  break
              if time.time() > deadline:
                  raise TimeoutError(f"server did not announce a port: {text}")
              time.sleep(0.1)
          while True:
              try:
                  sock = socket.create_connection(("127.0.0.1", port), timeout=1)
                  break
              except OSError:
                  if time.time() > deadline:
                      raise
                  time.sleep(0.2)
          sock.settimeout(30)
          with sock:
              for line in [
                  '{"jsonrpc":"2.0","id":"status","method":"sim.status","params":{}}\n',
                  '{"jsonrpc":"2.0","id":"intervention","method":"intervention.apply","params":{"intervention_type":"set_velocity","payload":{"object_id":"red_cube","velocity":[0.2,0.0,0.0]}}}\n',
                  '{"jsonrpc":"2.0","id":"step","method":"sim.step","params":{"dt":0.1}}\n',
                  '{"jsonrpc":"2.0","id":"stop","method":"log.stop","params":{}}\n',
              ]:
                  sock.sendall(line.encode())
              sock.shutdown(socket.SHUT_WR)
              chunks = []
              while True:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  chunks.append(chunk)
          print(b"".join(chunks).decode(), end="")
          PY
          wait "$TCP_PID"
          TCP_PID=""
          grep -q '"id":"status"' /tmp/prisoma_bridge_tcp.out
          grep -q '"id":"intervention"' /tmp/prisoma_bridge_tcp.out
          grep -q '"id":"step"' /tmp/prisoma_bridge_tcp.out
          grep -q '"id":"stop"' /tmp/prisoma_bridge_tcp.out
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_bridge_tcp.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_tcp.jsonl | grep -F 'flow_pred_records=2' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_tcp.jsonl | grep -F 'interventions=1' >/dev/null
          cargo run --locked -p pid-sim --bin pid-sim-verify -- /tmp/prisoma_bridge_tcp.jsonl
          if cargo run --locked -p pid-sim --features rerun-export,websocket --bin pid-sim-bridge-ws -- --bind "[::]:0" /tmp/prisoma_bridge_ws_nonloopback.jsonl; then exit 1; fi
          test ! -e /tmp/prisoma_bridge_ws_nonloopback.jsonl
          setsid cargo run --locked -p pid-sim --features rerun-export,websocket --bin pid-sim-bridge-ws -- --allow-mutations --bind "127.0.0.1:0" /tmp/prisoma_bridge_ws.jsonl 2>/tmp/prisoma_bridge_ws.server.log &
          WS_PID="$!"
          python - <<'PY' /tmp/prisoma_bridge_ws.server.log > /tmp/prisoma_bridge_ws.out
          import base64, hashlib, json, os, pathlib, re, socket, struct, sys, time
          deadline = time.time() + 30
          log_path = pathlib.Path(sys.argv[1])
          port = None
          while port is None:
              text = log_path.read_text() if log_path.exists() else ""
              match = re.search(r"(?:^|\n)listening 127\.0\.0\.1:(\d+)(?:\n|$)", text)
              if match:
                  port = int(match.group(1))
                  break
              if time.time() > deadline:
                  raise TimeoutError(f"server did not announce a port: {text}")
              time.sleep(0.1)
          while True:
              try:
                  sock = socket.create_connection(("127.0.0.1", port), timeout=1)
                  break
              except OSError:
                  if time.time() > deadline:
                      raise
                  time.sleep(0.2)
          sock.settimeout(30)
          def recv_exact(sock, size):
              chunks = []
              remaining = size
              while remaining:
                  chunk = sock.recv(remaining)
                  if not chunk:
                      raise EOFError(f"WebSocket closed with {remaining} byte(s) outstanding")
                  chunks.append(chunk)
                  remaining -= len(chunk)
              return b"".join(chunks)
          def send_frame(sock, opcode, payload):
              if isinstance(payload, str):
                  payload = payload.encode()
              key = b"\x01\x02\x03\x04"
              n = len(payload)
              if n < 126:
                  header = bytes([0x80 | opcode, 0x80 | n])
              elif n < 65536:
                  header = bytes([0x80 | opcode, 0x80 | 126]) + struct.pack("!H", n)
              else:
                  header = bytes([0x80 | opcode, 0x80 | 127]) + struct.pack("!Q", n)
              sock.sendall(header + key + bytes(b ^ key[i % 4] for i, b in enumerate(payload)))
          def recv_frame(sock):
              first, second = recv_exact(sock, 2)
              opcode = first & 0x0F
              n = second & 0x7F
              if n == 126:
                  n = struct.unpack("!H", recv_exact(sock, 2))[0]
              elif n == 127:
                  n = struct.unpack("!Q", recv_exact(sock, 8))[0]
              payload = recv_exact(sock, n)
              return opcode, payload
          with sock:
              key = base64.b64encode(os.urandom(16)).decode()
              sock.sendall((f"GET /bridge HTTP/1.1\r\nHost: 127.0.0.1:{port}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n").encode())
              response = b""
              while b"\r\n\r\n" not in response:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise EOFError("WebSocket closed during HTTP upgrade")
                  response += chunk
              expected = base64.b64encode(hashlib.sha1((key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode()).digest()).decode()
              if b"101 Switching Protocols" not in response:
                  raise RuntimeError(f"unexpected WebSocket upgrade response: {response!r}")
              if f"Sec-WebSocket-Accept: {expected}".encode() not in response:
                  raise RuntimeError("WebSocket upgrade accept hash did not match")
              for request in [
                  {"jsonrpc":"2.0","id":"status","method":"sim.status","params":{}},
                  {"jsonrpc":"2.0","id":"intervention","method":"intervention.apply","params":{"intervention_type":"set_velocity","payload":{"object_id":"red_cube","velocity":[0.2,0.0,0.0]}}},
                  {"jsonrpc":"2.0","id":"step","method":"sim.step","params":{"dt":0.1}},
                  {"jsonrpc":"2.0","id":"export","method":"export.rerun","params":{"run_log_uri":"/tmp/prisoma_bridge_demo.jsonl","output_uri":"/tmp/prisoma_bridge_ws_export.rrd"}},
              ]:
                  send_frame(sock, 0x1, json.dumps(request, separators=(",", ":")))
                  opcode, payload = recv_frame(sock)
                  if opcode != 0x1:
                      raise RuntimeError(f"unexpected WebSocket opcode: {opcode}")
                  print(payload.decode())
              send_frame(sock, 0x8, b"")
              recv_frame(sock)
          PY
          wait "$WS_PID"
          WS_PID=""
          trap - EXIT
          grep -q '"id":"status"' /tmp/prisoma_bridge_ws.out
          grep -q '"id":"intervention"' /tmp/prisoma_bridge_ws.out
          grep -q '"id":"step"' /tmp/prisoma_bridge_ws.out
          grep -q '"id":"export"' /tmp/prisoma_bridge_ws.out
          grep -q '"sha256"' /tmp/prisoma_bridge_ws.out
          test -s /tmp/prisoma_bridge_ws_export.rrd
          "$PID_RUNLOG_REPLAY" --validate /tmp/prisoma_bridge_ws.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_ws.jsonl | grep -F 'flow_pred_records=2' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_ws.jsonl | grep -F 'interventions=1' >/dev/null
          "$PID_RUNLOG_REPLAY" /tmp/prisoma_bridge_ws.jsonl | grep -F 'artifacts=1' >/dev/null
          cargo run --locked -p pid-sim --bin pid-sim-verify -- /tmp/prisoma_bridge_ws.jsonl

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # ncp-observer git-deps NCP/Zenoh and the default members path-dep the pid-rs
          # submodule; fetch it so the manifests resolve. The vendored `.external/repos/*`
          # trees are NOT part of either dependency graph, so cargo-deny never walks them.
          submodules: recursive
      - name: Install Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default 1.93.0
          rustc --version | grep -F 'rustc 1.93.0 '
      - name: Install the checksum-pinned cargo-deny binary
        run: |
          archive="$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny-0.20.2"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 --retry-max-time 600 \
            --max-filesize 10000000 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $archive" \
            | sha256sum --check --strict
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            --strip-components=1 --no-same-owner
          test -x "$install_dir/cargo-deny"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cargo-deny" --version
      # cargo-deny over the root workspace. ncp-observer and the pid-rs submodule are
      # workspace-excluded and are NOT scanned by this invocation.
      # Fails closed on any deny-level finding (advisory, disallowed license, unknown git
      # source, …) per ./deny.toml.
      - name: cargo-deny (workspace)
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --locked --all-features check
      # ncp-observer is workspace-EXCLUDED (it pulls in NCP + Zenoh, deliberately off the
      # critical path) so it needs an explicit pass via --manifest-path. Same deny.toml.
      - name: cargo-deny (ncp-observer)
        run: cargo-deny --log-level warn --manifest-path crates/ncp-observer/Cargo.toml --locked check
      - name: Reject the vulnerable Zenoh compression feature
        run: |
          # Scan the complete resolved feature graph so a second Zenoh transport
          # version cannot bypass the advisory exception's compression guard.
          if cargo tree --locked --manifest-path crates/ncp-observer/Cargo.toml -e features | grep -F 'zenoh-transport feature "transport_compression"'; then
            echo "vulnerable Zenoh transport compression feature is enabled" >&2
            exit 1
          fi
          cargo tree --locked --manifest-path crates/ncp-observer/Cargo.toml -e features -f '{p} features=[{f}]' | grep -F 'zenoh-transport v1.9.0' >/dev/null

  parallel:
    name: Parallel estimator path
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive  # builds pid-core from the pid-rs submodule
      - name: Install Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default 1.93.0
          rustc --version | grep -F 'rustc 1.93.0 '
      - name: Clippy (parallel feature)
        run: cargo clippy --locked --manifest-path pid-rs/crates/pid-core/Cargo.toml --features parallel --all-targets -- -D warnings
      - name: pid-core tests under the exact parallel KSG path
        run: cargo test --locked --manifest-path pid-rs/crates/pid-core/Cargo.toml --features parallel

  docs:
    name: Documentation and truth audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The release-review auditor verifies the historical frozen cut, not only HEAD.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.11.15"
          enable-cache: false
      - name: Sync locked documentation-audit environment
        run: uv sync --locked --no-default-groups --group docs
      - name: Audit M0 research governance and its expected closed freeze gate
        run: |
          python scripts/audit_research_governance.py
          if python scripts/audit_research_governance.py --require-freeze-ready > /tmp/m0-freeze.stdout 2> /tmp/m0-freeze.stderr; then
            echo "M0 v1 unexpectedly reported freeze readiness" >&2
            exit 1
          else
            status=$?
          fi
          cat /tmp/m0-freeze.stderr
          test "$status" -eq 3
          test ! -s /tmp/m0-freeze.stdout
          grep -Fx -- '- M0_PREREGISTRATION_UNFROZEN' /tmp/m0-freeze.stderr
          grep -Fx -- '- M0_H3_FOUR_PID_GATES_BLOCKED' /tmp/m0-freeze.stderr
          grep -Fx -- '- M0_FRESH_REPRODUCIBLE_LITERATURE_SEARCH_REQUIRED' /tmp/m0-freeze.stderr
          python scripts/audit_research_governance_successor.py
          if python scripts/audit_research_governance_successor.py --require-freeze-ready > /tmp/m0-successor-freeze.stdout 2> /tmp/m0-successor-freeze.stderr; then
            echo "M0 successor draft unexpectedly reported freeze readiness" >&2
            exit 1
          else
            successor_status=$?
          fi
          cat /tmp/m0-successor-freeze.stderr
          test "$successor_status" -eq 3
          test ! -s /tmp/m0-successor-freeze.stdout
          grep -Fx -- '- M0_SUCCESSOR_DRAFT_UNFROZEN' /tmp/m0-successor-freeze.stderr
          grep -Fx -- '- M0_SUCCESSOR_H3_INCREMENTAL_VALUE_AND_WARNING_CONTRACT_UNFROZEN' /tmp/m0-successor-freeze.stderr
          grep -Fx -- '- M0_SUCCESSOR_H4_TARGET_TRANSPORT_TUPLE_INFERENCE_POWER_UNFROZEN' /tmp/m0-successor-freeze.stderr
      - name: Generated capability matrix is current
        run: python scripts/generate_capability_matrix.py --check
      - name: External GitHub Actions use immutable commit pins
        run: python scripts/audit_ci_pins.py
      - name: Frozen 0.9 release-review intake is internally consistent
        run: |
          python scripts/audit_release_requirements.py
          python scripts/audit_release_review.py
      - name: Unpublished 0.9 candidate state is content-bound and honest
        run: python scripts/audit_candidate_release.py
      - name: Audit grandplan titles
        run: python scripts/audit_grandplan.py --check-italic-titles
      - name: Audit grandplan claims
        run: python scripts/audit_grandplan_claims.py
      - name: Audit docset claims
        run: python scripts/audit_docset_claims.py --all-tracked-markdown
      - name: Audit Markdown links and heading anchors
        run: uv run --no-sync python scripts/audit_markdown_links.py
      - name: Audit repository truth against pinned dependencies
        run: python scripts/audit_repo_truth.py

  formal:
    name: Formal models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"
      - name: Install the SMT solver
        run: |
          archive="$RUNNER_TEMP/z3-4.16.0-x64-glibc-2.39.zip"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 --retry-max-time 900 \
            --max-filesize 60000000 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          echo "7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e  $archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          z3_bin="$RUNNER_TEMP/z3-4.16.0-x64-glibc-2.39/bin"
          echo "$z3_bin" >> "$GITHUB_PATH"
          "$z3_bin/z3" -version
      - name: Check formal invariants and countermodels
        run: python scripts/check_formal_models.py

  python-bindings:
    name: Python bindings and experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:

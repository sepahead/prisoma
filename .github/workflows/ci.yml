      - name: Sync locked Python test environment
        run: uv sync --locked --no-default-groups --group runtime --group dev --group docs --group ui
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Build extension in the locked environment
        run: uv run --no-sync maturin develop --locked --manifest-path pid-rs/crates/pid-python/Cargo.toml
      - name: Python tests
        run: uv run --no-sync pytest tests/python -q
      - name: Build the run-log verifier once
        run: cargo build --locked --manifest-path pid-rs/crates/pid-runlog/Cargo.toml --bin pid-runlog-replay
      - name: SAFE adapter -> offline-harness contract round-trip
        run: |
          uv run --no-sync python -m experiments.safe_adapter synth --out /tmp/safe_synth
          test -s /tmp/safe_synth/safe_bundle_manifest.json
          uv run --no-sync python -m experiments.safe_adapter convert --rollouts /tmp/safe_synth --out /tmp/safe_vlda.json --seen-tasks 0,1
          uv run --no-sync python -c 'import json; d=json.load(open("/tmp/safe_vlda.json", encoding="utf-8")); ok=d["samples"] and all(s["metadata"].get("bundle_manifest_sha256") for s in d["samples"]); raise SystemExit(0 if ok else "missing bundle-manifest binding")'
          uv run --no-sync python -m experiments.safe_adapter verify --input /tmp/safe_vlda.json
          cargo run --locked -p pid-sim --features analysis --bin pid-offline-harness -- --input /tmp/safe_vlda.json --summary-json /tmp/safe_vlda_summary.json --runlog /tmp/safe_vlda_runlog.jsonl --require-heldout-split --require-heldout-class-coverage --require-heldout-episode-disjoint --require-axis-provenance-honest
          "$PID_RUNLOG_REPLAY" --validate /tmp/safe_vlda_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/safe_vlda_runlog.jsonl | grep -F 'errors=0' >/dev/null
      - name: Attribution probe -> attribution_logged run log
        run: |
          uv run --no-sync python -m experiments.attribution demo --runlog /tmp/attr_runlog.jsonl --artifacts /tmp/attr_artifacts
          "$PID_RUNLOG_REPLAY" --validate /tmp/attr_runlog.jsonl
          "$PID_RUNLOG_REPLAY" /tmp/attr_runlog.jsonl | grep -F 'attributions=2' >/dev/null
      - name: Third-party notices are up to date
        run: uv run --no-sync python scripts/generate_third_party_notices.py --check
